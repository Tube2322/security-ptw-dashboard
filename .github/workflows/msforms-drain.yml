name: Drain Microsoft Forms queue

# Sends every submission the website could not deliver to the other department's Microsoft Form on the
# spot. The website records each one in ms_forms_jobs first; this job retries them until they are sent.
# Needs one repository secret: SUPABASE_SERVICE_ROLE_KEY (Settings -> Secrets and variables -> Actions).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

# a run that is still busy must never overlap the next one
concurrency:
  group: msforms-drain
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets a run queue its own successor while jobs remain, so the chain does not depend on cron

jobs:
  drain:
    if: github.repository == 'Tube2322/security-ptw-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
    steps:
      - name: Secret check
        if: env.HAS_KEY != 'true'
        run: echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not set as a repository secret, so nothing was sent. Add it under Settings -> Secrets and variables -> Actions."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: '24'
      - name: Install dependencies
        if: env.HAS_KEY == 'true'
        run: npm install --omit=dev --no-audit --no-fund
      - name: Send everything that is waiting
        if: env.HAS_KEY == 'true'
        run: node scripts/drain-msforms.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MSFORMS_BROWSER: system-chrome
          GITHUB_TOKEN: ${{ github.token }}
