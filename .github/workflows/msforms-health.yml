name: Check Microsoft Forms health

# Once a day, opens every Microsoft Form the site forwards to and checks that it still looks the way the
# sender expects (question count, choices, date handling) without submitting anything. A failing run
# e-mails the repository owner through GitHub's normal workflow-failure notification, and the result of
# each form is shown on the Settings page. Needs the same SUPABASE_SERVICE_ROLE_KEY secret as the queue.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  health:
    if: github.repository == 'Tube2322/security-ptw-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
    steps:
      - name: Secret check
        if: env.HAS_KEY != 'true'
        run: echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not set as a repository secret, so nothing was checked."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: '24'
      - name: Install dependencies
        if: env.HAS_KEY == 'true'
        run: npm install --omit=dev --no-audit --no-fund
      - name: Check every form
        if: env.HAS_KEY == 'true'
        run: node scripts/healthcheck-msforms.js
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MSFORMS_BROWSER: system-chrome
